spring.application.name=lms-service
server.port=${SERVER_PORT:8080}

# PostgreSQL is the sole application database. Credentials are supplied externally.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lms}
spring.datasource.username=${DB_USERNAME:lms}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate updates an existing schema for this starter project. For production,
# replace this with versioned Flyway/Liquibase migrations before schema changes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Redis-backed Spring Cache. Redis is shared by all LMS instances.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.cache.type=redis

# A secret of at least 32 random bytes is required; never commit the real value.
jwt.secret=${JWT_SECRET}

# SMTP is optional; the app can start without mail credentials.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Health endpoint for Docker and load-balancer checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true

# Set false on additional replicas to avoid duplicate scheduled work.
lms.scheduling.enabled=${LMS_SCHEDULING_ENABLED:true}
